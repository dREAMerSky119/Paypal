services:
  - type: web
    name: backend-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    # Only redeploy when backend code changes
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Set this in the Render dashboard to your Vercel URL,
      # e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false
