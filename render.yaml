services:
  - type: web
    name: backend-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    # Only redeploy when backend code changes
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Set this in the Render dashboard to your Vercel URL,
      # e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false
      # PayPal sandbox app credentials (set in the Render dashboard)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEPOSIT_PCT
        value: "30"
      # Gemini (optional; the advisor falls back to rules without it)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
